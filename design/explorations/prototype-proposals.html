<!doctype html>
<html lang="ru" data-theme="light" data-nav="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opsentri — прототип с правками</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f0ec; --card:#fff; --card-2:#f7f6f3; --line:#eae8e2;
  --ink:#1a1a17; --ink-2:#65645d;
  --a:#f0562b; --a1:#cc3a0d; --a2:#c0330a; --a-soft:#fde9e1;
  --ok:#167a3c; --ok-soft:#e3f2e7; --warn:#a05a08; --warn-soft:#f7ecd9;
  --crit:#c22a20; --crit-soft:#fbe6e3;
  --r:20px; --r-s:12px; --nav-w:250px;
  --sh:0 1px 2px rgba(26,26,23,.05), 0 10px 26px -14px rgba(26,26,23,.2);
}
[data-theme="dark"]{
  --bg:#111110; --card:#1c1c19; --card-2:#232320; --line:#2e2e29;
  --ink:#f1f0eb; --ink-2:#aba9a1; --a2:#ff9877; --a-soft:#3a1d12;
  --ok:#5cc77f; --ok-soft:#16301f; --warn:#e8b45c; --warn-soft:#33280f;
  --crit:#ff8a7a; --crit-soft:#331a16;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.8);
}
[data-nav="collapsed"]{--nav-w:64px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Fira Sans","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
::selection{background:var(--a);color:#fff}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.02em}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"Fira Code",ui-monospace,monospace}

.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);gap:13px;padding:13px;min-height:100vh}

.nav{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  display:flex;flex-direction:column;padding:11px 9px;position:sticky;top:13px;
  max-height:calc(100vh - 26px);overflow:hidden}
.navtop{display:flex;align-items:center;gap:8px;padding:0 3px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.burger{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.burger:hover{background:var(--card-2)}
.wm{display:flex;align-items:center;gap:8px;min-width:0}
.wm i{width:29px;height:29px;border-radius:9px;background:var(--a1);display:grid;place-items:center;flex:none}
.wm b{font-weight:800;font-size:15px;white-space:nowrap}
.navbody{flex:1;overflow-y:auto;overflow-x:hidden}
.grph{width:100%;display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:10px;
  font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);text-align:left;margin-top:3px}
.grph:hover{background:var(--card-2);color:var(--ink)}
.grph .chev{margin-left:auto;transition:transform .18s;flex:none}
.grp[data-open="false"] .chev{transform:rotate(-90deg)}
.grp[data-open="false"] .grpi{display:none}
.grpi{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;
  color:var(--ink-2);font-weight:600;font-size:13px;width:100%;text-align:left;white-space:nowrap;overflow:hidden}
.item:hover{background:var(--card-2);color:var(--ink)}
.item[aria-current="true"]{background:var(--a-soft);color:var(--a2)}
.item .tk{width:23px;height:23px;border-radius:7px;flex:none;display:grid;place-items:center;
  font-size:9px;font-weight:800;color:#fff}
.tk.gp{background:#2f7d3a}.tk.pg{background:#2c5c80}.tk.ora{background:#a83a2b}
.tk.my{background:#0a6478}.tk.kf{background:#3b414a}.tk.dz{background:#4e7029}
.tk.lr{background:#7a5f33}.tk.pl{background:#4a5bbf}
.item .soon{margin-left:auto;flex:none;font-size:11px;font-weight:700;background:var(--card-2);
  color:var(--ink-2);border-radius:99px;padding:1px 7px}
.item .cnt{margin-left:auto;flex:none;font-size:11px;font-weight:700;background:var(--a1);color:#fff;
  border-radius:99px;padding:1px 7px}
.navfoot{padding-top:8px;border-top:1px solid var(--line);margin-top:8px;display:flex;gap:4px;align-items:center}
.navfoot button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.navfoot button:hover{background:var(--card-2);color:var(--ink)}
.who{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 6px;border-radius:10px}
.who:hover{background:var(--card-2)}
.who i{width:28px;height:28px;border-radius:99px;background:var(--a-soft);color:var(--a2);
  display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.who span{display:flex;flex-direction:column;line-height:1.25;min-width:0;text-align:left}
.who b{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{font-style:normal;font-size:11px;color:var(--ink-2)}
[data-nav="collapsed"] .wm b,[data-nav="collapsed"] .grph span,
[data-nav="collapsed"] .item .lb,[data-nav="collapsed"] .item .soon,
[data-nav="collapsed"] .item .cnt,[data-nav="collapsed"] .who span,
[data-nav="collapsed"] .lang{display:none}
[data-nav="collapsed"] .navtop{flex-direction:column;gap:8px}
[data-nav="collapsed"] .grph{justify-content:center;padding:5px 0;pointer-events:none}
[data-nav="collapsed"] .grph .chev{display:none}
[data-nav="collapsed"] .grph::after{content:"";width:18px;height:1px;background:var(--line)}
[data-nav="collapsed"] .grp[data-open="false"] .grpi{display:flex}
[data-nav="collapsed"] .item{justify-content:center;padding:8px 0}
[data-nav="collapsed"] .navfoot{flex-direction:column}

.main{display:flex;flex-direction:column;gap:13px;min-width:0}
.bar{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  display:flex;align-items:center;gap:16px;padding:10px 14px;flex-wrap:wrap}
.secid{display:flex;flex-direction:column;min-width:0}
.secid .tkn{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.secid h1{font-size:19px;font-weight:800}
.tabs{display:flex;gap:2px;background:var(--card-2);border-radius:99px;padding:4px;flex-wrap:wrap;margin-left:auto}
.tabs button{padding:7px 13px;border-radius:99px;color:var(--ink-2);font-weight:600;font-size:13px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--ink);color:var(--card)}

.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.panel h2{font-size:15px;font-weight:800;margin-bottom:3px}
.panel .sub{color:var(--ink-2);font-size:13px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;
  font-size:12px;font-weight:700;background:var(--card-2);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.acc{background:var(--a-soft);color:var(--a2)}
.chip button{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;
  border-radius:var(--r-s);font-weight:700;font-size:13px}
.btn.solid{background:var(--a1);color:#fff}
.btn.solid:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--card-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--crit);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 11px;font-size:12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:14px 0}
.muted{color:var(--ink-2)}
.f13{font-size:13px}

.alert{border-radius:var(--r-s);padding:13px 15px;font-weight:600;
  --st:var(--ink-2);background:color-mix(in srgb, var(--st) 14%, var(--card-2));
  border:1.5px solid color-mix(in srgb, var(--st) 62%, transparent)}
.alert.crit{--st:var(--crit);color:color-mix(in srgb, var(--crit) 82%, var(--ink));font-weight:700}
.alert.warn{--st:var(--warn);font-weight:700}
.alert.ok{--st:var(--ok)}
.alert h3{font-size:14px;font-weight:800;margin-bottom:3px}
.alert p{margin:0;font-weight:500;color:var(--ink)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:700;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--card-2)}
.stick{position:sticky;left:0;background:var(--card);z-index:2}
tbody tr:hover .stick{background:var(--card-2)}
.scrollx{overflow-x:auto}

.seg{height:11px;border-radius:99px;overflow:hidden;display:flex;background:var(--card-2)}
.seg i{display:block;height:100%}
.seg i.d{background:var(--ok)}.seg i.e{background:var(--crit)}.seg i.a{background:var(--a)}

.skel{background:linear-gradient(90deg,var(--card-2),var(--line),var(--card-2));
  background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:8px;height:38px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}*{transition:none!important}}

.env{font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:99px;padding:2px 8px}
.env.prod{background:var(--crit-soft);color:var(--crit)}
.env.test{background:var(--warn-soft);color:var(--warn)}
.env.dev{background:var(--card-2);color:var(--ink-2)}

.conn{border:1px solid var(--line);border-radius:var(--r-s);padding:14px;background:var(--card)}
.conn .h{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.conn dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.conn dt{color:var(--ink-2)}
.conn dd{margin:0}
.roles{display:flex;gap:2px;background:var(--card-2);border-radius:99px;padding:3px;margin-top:11px;width:fit-content}
.roles button{padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;color:var(--ink-2)}
.roles button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

.qline{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:11px 13px;background:var(--card-2);
  border-radius:var(--r-s);margin-bottom:13px}
.qline .ax{font-size:12px;color:var(--ink-2);font-weight:600}

.gate{border:1.5px dashed var(--line);border-radius:var(--r-s);padding:14px;margin-top:13px}
.gate.armed{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.gate.blocked{border-style:solid;border-color:var(--crit);background:var(--crit-soft)}

.opsel{display:flex;gap:2px;background:var(--card-2);border-radius:99px;padding:3px;width:fit-content;flex-wrap:wrap}
.opsel button{padding:6px 13px;border-radius:99px;font-size:13px;font-weight:700;color:var(--ink-2)}
.opsel button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

.tog{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--a1)}

.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q .sig{min-width:0}
.q summary{font-size:12px;color:var(--ink-2);cursor:pointer;margin-top:4px}
.q pre{margin:6px 0 0;font-size:12px;background:var(--card-2);padding:9px;border-radius:8px;
  overflow-x:auto;font-family:"Fira Code",monospace}

.diff{display:flex;flex-direction:column;gap:6px;margin-top:11px}
.diff div{display:flex;gap:9px;align-items:center;font-size:13px;padding:7px 10px;border-radius:8px}
.diff .add{background:var(--ok-soft);color:var(--ok)}
.diff .del{background:var(--crit-soft);color:var(--crit)}

.note{font-size:12px;color:var(--ink-2);margin:9px 0 0}
.foot{color:var(--ink-2);font-size:12px;padding:0 4px 6px}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .nav{position:static;max-height:none}
  [data-nav="collapsed"] .navbody{display:none}
  .tabs{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="app">

  <aside class="nav">
    <div class="navtop">
      <button class="burger" id="burger" aria-label="Свернуть навигацию" aria-expanded="true">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
      </button>
      <span class="wm"><i>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4.5 16.5a8.5 8.5 0 1 1 15 0"/><path d="M12 15l4.4-5.4"/><circle cx="12" cy="15" r="1.7" fill="#fff" stroke="none"/></svg>
      </i><b>Opsentri</b></span>
    </div>
    <div class="navbody" id="navbody"></div>
    <div class="navfoot">
      <button id="themeBtn" title="Тёмная тема" aria-label="Переключить тему">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" id="themeIcon"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.6v2.2M10 16.2v2.2M18.4 10h-2.2M3.8 10H1.6M15.9 4.1l-1.6 1.6M5.7 14.3l-1.6 1.6M15.9 15.9l-1.6-1.6M5.7 5.7L4.1 4.1"/></svg>
      </button>
      <button class="lang" id="langBtn" title="Язык интерфейса" aria-label="Язык интерфейса"
        style="width:auto;padding:0 10px;font-size:12px;font-weight:800;letter-spacing:.06em">RU</button>
      <button class="who" id="whoBtn" style="width:auto;flex:1;justify-content:flex-start">
        <i>МК</i><span><b>Меирбек</b><em>operator · PROD</em></span>
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="bar">
      <div class="secid"><span class="tkn" id="tkName">Greenplum Toolkit</span><h1 id="pgTitle">Dashboard</h1></div>
      <nav class="tabs" id="tabs"></nav>
    </div>
    <div id="view"></div>
    <p class="foot">Прототип предложений. Данные синтетические, кластера за ним нет — состояния воспроизведены по тому, что видели на GP_TEST.</p>
  </div>
</div>

<script>
(function(){
var $=function(s){return document.querySelector(s);}, root=document.documentElement;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

var S={
  tk:'gp', page:'dash',
  runs:[
    {id:46,kind:'Анализ перекоса',done:47,total:822,err:775,st:'interrupted',when:'25.07 22:58'},
    {id:50,kind:'VACUUM ANALYZE',done:151,total:151,err:0,st:'done',when:'26.07 07:46'},
    {id:49,kind:'VACUUM ANALYZE',done:151,total:151,err:0,st:'done',when:'26.07 07:44'},
    {id:39,kind:'VACUUM FULL',done:0,total:30,err:0,st:'interrupted',when:'25.07 22:45'}
  ],
  conns:[
    {id:1,name:'dwh-gp-01',env:'prod',db:'adb',host:'10.4.12.7',role:'src',seg:96,tested:null,ver:null},
    {id:2,name:'GP_TEST',env:'test',db:'adb',host:'172.17.56.240',role:'both',seg:24,tested:null,ver:null}
  ],
  copy:{src:2,dst:2,exist:'truncate',tables:12,previewed:false,ttl:0},
  vac:{op:'VACUUM ANALYZE',destructive:false,selected:12},
  health:{loaded:false,secs:0,timer:null},
  grants:{scope:'запись',view:'матрица',gran:'схемы',stale:22},
  acl:{previewed:false}
};

var NAV=[
 {g:'DB OPERATIONS',items:[
   {id:'gp',tk:'gp',label:'Greenplum Toolkit'},
   {id:'pg',tk:'pg',label:'Postgres Toolkit'},
   {id:'ora',tk:'ora',label:'Oracle Toolkit',soon:1},
   {id:'my',tk:'my',label:'MySQL Toolkit',soon:1}]},
 {g:'DATA FLOW',items:[
   {id:'kafka',tk:'kf',label:'Kafka'},
   {id:'dbz',tk:'dz',label:'Debezium',soon:1},
   {id:'lr',tk:'lr',label:'OpenLogReplicator',soon:1},
   {id:'pl',tk:'pl',label:'Pipelines',soon:1}]}
];
var TABS={
  gp:[['dash','Dashboard'],['health','Здоровье БД'],['conn','Подключения'],['copy','Синхронизация'],
      ['maint','Maintenance'],['vac','Vacuum / Analyze'],['grants','Гранты']],
  pg:[['pgconn','Подключения'],['pgbk','Резервные копии']],
  kafka:[['kacl','Доступы'],['kgroups','Консьюмер-группы']]
};
var TKNAME={gp:'Greenplum Toolkit',pg:'Postgres Toolkit',kafka:'Kafka',
  ora:'Oracle Toolkit',my:'MySQL Toolkit',dbz:'Debezium',lr:'OpenLogReplicator',pl:'Pipelines'};

function buildNav(){
  var running=S.runs.filter(function(r){return r.st==='running';}).length;
  var h='';
  NAV.forEach(function(sec){
    h+='<section class="grp" data-open="true"><button class="grph"><span>'+sec.g+'</span>'+
       '<svg class="chev" width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5.5 8l4.5 4.4L14.5 8"/></svg></button><div class="grpi">';
    sec.items.forEach(function(it){
      h+='<button class="item" data-sec="'+it.id+'" title="'+esc(it.label)+'">'+
         '<span class="tk '+it.tk+'">'+it.tk.toUpperCase()+'</span>'+
         '<span class="lb">'+esc(it.label)+'</span>'+
         (it.soon?'<span class="soon">скоро</span>':
          (it.id==='gp'&&running?'<span class="cnt">'+running+'</span>':''))+'</button>';
    });
    h+='</div></section>';
  });
  $('#navbody').innerHTML=h;
  $('#navbody').querySelectorAll('.grph').forEach(function(b){
    b.addEventListener('click',function(){
      var s=b.parentElement; s.dataset.open=s.dataset.open==='true'?'false':'true';
    });
  });
  $('#navbody').querySelectorAll('.item').forEach(function(b){
    b.addEventListener('click',function(){ go(b.dataset.sec); });
    b.setAttribute('aria-current', b.dataset.sec===S.tk?'true':'false');
  });
}
function go(tk,page){
  S.tk=tk;
  var t=TABS[tk];
  S.page=page||(t?t[0][0]:'stub');
  render();
}

function firstRun(t,d,cta){
  return '<section class="panel" style="text-align:center;padding:44px 22px">'+
    '<h2 style="font-size:21px">'+esc(t)+'</h2>'+
    '<p class="sub" style="max-width:56ch;margin:9px auto 16px">'+esc(d)+'</p>'+
    '<button class="btn solid" data-goto="conn">'+esc(cta)+'</button>'+
    '<p class="note" style="max-width:60ch;margin:16px auto 0">Было: два пустых заголовка «Источники / Назначения», 80% пустого экрана и инструкция «найди вкладку сам» без ссылки.</p></section>';
}

var P={

dash:function(){
  var running=S.runs.filter(function(r){return r.st==='running';}).length;
  var attn=S.runs.filter(function(r){return r.st==='interrupted'||r.st==='failed';}).length;
  var h='<section class="panel"><div class="row" style="justify-content:space-between">'+
    '<div><h2>Состояние смены</h2><p class="sub" style="margin:0">окно обслуживания до 05:00</p></div>'+
    '<span class="chip">проверка кластера 25 мин назад</span></div>'+
    '<div class="row" style="margin-top:13px">'+

    '<div class="gate '+(S.acl.previewed?'armed':'')+'" style="margin-top:13px">';
  if(!S.acl.previewed){
    h+='<p style="margin:0 0 11px">Принципал <b>User:etl_writer</b> · топик <b>orders.*</b> · пресет <b>Чтение</b></p>'+
       '<button class="btn solid" id="aclPrev">Показать, что изменится</button>';
  } else {
    h+='<p style="margin:0"><b>Что изменится</b></p>'+
       '<div class="diff"><div class="add">+ 3 правила · User:etl_writer · READ на orders.*</div>'+
       '<div class="del">− 1 правило · User:etl_writer · WRITE на orders.raw</div>'+
       '<div>затронуто 2 принципала, 4 топика</div></div>'+
       '<div class="row" style="margin-top:13px"><button class="btn solid" id="aclApply">Применить</button>'+
       '<button class="btn ghost" id="aclCancel">Отменить</button></div>';
  }
  h+='</div><p class="note">Было: «Выдать права», «Показать, что попадёт под отзыв» и «Отозвать» тремя равноправными кнопками — отзыв нажимался без превью.</p></section>';
  return h;
},

kgroups:function(){
  return '<section class="panel"><h2>Консьюмер-группы</h2><p class="sub">срез ещё не снят</p>'+
    '<div class="alert"><h3>Срез не снят</h3><p>Снимок метаданных кластера: операции читают его, а не ходят в брокеры на каждый клик.</p>'+
    '<div class="row" style="margin-top:11px"><button class="btn solid sm">Снять срез</button></div></div>'+
    '<div class="sep"></div><h2>Журнал действий</h2>'+
    '<div class="alert" style="margin-top:9px"><p>Здесь останется запись о каждом сбросе оффсетов: кто, когда, какая группа, с какого значения на какое.</p></div>'+
    '<p class="note">Было: заголовок «Журнал действий» над пустым контейнером — без содержимого и без пустого состояния.</p></section>';
},
pgconn:function(){ return firstRun('Postgres Toolkit не подключён',
  'После подключения появятся pg_dump и pg_restore, синхронизация и расписания.','Добавить сервер PostgreSQL'); },
pgbk:function(){ return firstRun('Postgres Toolkit не подключён',
  'Резервные копии появятся здесь, как только будет сервер. Одно сообщение вместо двух спорящих.','Добавить сервер PostgreSQL'); },
stub:function(){
  return '<section class="panel" style="text-align:center;padding:44px 22px">'+
    '<h2 style="font-size:21px">'+esc(TKNAME[S.tk]||'Раздел')+'</h2>'+
    '<p class="sub" style="max-width:56ch;margin:9px auto 0">В продукте не реализовано. Место в структуре зарезервировано, чтобы набор инструментов рос без перестройки навигации.</p></section>';
}
};

function render(){
  var tabs=TABS[S.tk];
  $('#tkName').textContent=TKNAME[S.tk]||'';
  $('#tabs').innerHTML=tabs?tabs.map(function(t){
    return '<button data-tab="'+t[0]+'" aria-current="'+(S.page===t[0])+'">'+t[1]+'</button>';
  }).join(''):'';
  var titles={dash:'Dashboard',health:'Здоровье БД',conn:'Подключения',copy:'Синхронизация данных',
    maint:'Maintenance',vac:'Vacuum / Analyze',grants:'Пользователи и гранты',
    kacl:'Доступы',kgroups:'Консьюмер-группы',pgconn:'Подключения PostgreSQL',pgbk:'Резервные копии'};
  $('#pgTitle').textContent=titles[S.page]||TKNAME[S.tk]||'';
  $('#view').innerHTML=(P[S.page]||P.stub)();
  buildNav();
  if(S.page==='health'&&!S.health.loaded) startHealth();
}

document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  var d=t.dataset, r;

  if(d.tab){ S.page=d.tab; render(); return; }
  if(d.goto){ go('gp',d.goto); return; }
  if(d.resume){ r=S.runs.filter(function(x){return x.id===+d.resume;})[0]; r.st='running'; r.err=0; render(); return; }
  if(d.stop){ r=S.runs.filter(function(x){return x.id===+d.stop;})[0]; r.st='interrupted'; render(); return; }
  if(d.repeat){ t.textContent='Поставлено в очередь'; t.disabled=true; return; }
  if(d.role){
    var pr=d.role.split(':'), c=S.conns.filter(function(x){return x.id===+pr[0];})[0];
    if(!(c.env==='prod'&&pr[1]!=='src')) c.role=pr[1];
    render(); return;
  }
  if(d.test){
    var c2=S.conns.filter(function(x){return x.id===+d.test;})[0];
    c2.tested=new Date().toTimeString().slice(0,5); c2.ver='GP 6.24'; render(); return;
  }
  if(d.pick){ var pk=d.pick.split(':'); S.copy[pk[0]]=+pk[1]; S.copy.previewed=false; render(); return; }
  if(d.exist){ S.copy.exist=d.exist; S.copy.previewed=false; render(); return; }
  if(t.id==='prevBtn'){ S.copy.previewed=true; S.copy.ttl=900; render(); startTtl(); return; }
  if(t.id==='resetPrev'){ S.copy.previewed=false; render(); return; }
  if(t.id==='runBtn'){
    S.runs.unshift({id:52,kind:'gpcopy: перенос',done:0,total:S.copy.tables,err:0,st:'running',when:'сейчас'});
    S.copy.previewed=false; go('gp','dash'); return;
  }
  if(d.op){ S.vac.op=d.op; render(); return; }
  if(t.id==='clearSel'){ S.vac.selected=0; render(); return; }
  if(t.id==='pickSel'){ S.vac.selected=12; render(); return; }
  if(t.id==='vacRun'){
    S.runs.unshift({id:53,kind:S.vac.op,done:0,total:S.vac.selected,err:0,st:'running',when:'сейчас'});
    go('gp','dash'); return;
  }
  if(t.id==='cancelH'){ stopHealth(); S.health.loaded=true; render(); return; }
  if(t.id==='reH'){ S.health.loaded=false; S.health.secs=0; render(); return; }
  if(t.id==='killQ'){ t.textContent='7 сеансов завершены'; t.disabled=true; return; }
  if(t.id==='toVac'){ S.vac.selected=3; go('gp','vac'); return; }
  if(t.id==='reSlice'){ S.grants.stale=0; render(); return; }
  if(t.id==='revoke'){ t.textContent='Превью REVOKE открыто'; t.disabled=true; return; }
  if(d.qx){ S.grants.scope='все права'; render(); return; }
  if(t.id==='aclPrev'){ S.acl.previewed=true; render(); return; }
  if(t.id==='aclCancel'){ S.acl.previewed=false; render(); return; }
  if(t.id==='aclApply'){ t.textContent='Применено'; t.disabled=true; return; }
  if(d.acl){
    document.querySelectorAll('[data-acl]').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
    t.setAttribute('aria-pressed','true'); return;
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='destr'){
    S.vac.destructive=e.target.checked;
    if(!S.vac.destructive&&/FULL|FREEZE/.test(S.vac.op)) S.vac.op='VACUUM ANALYZE';
    render();
  }
});

var ttlTimer=null;
function startTtl(){
  clearInterval(ttlTimer);
  ttlTimer=setInterval(function(){
    if(!S.copy.previewed){ clearInterval(ttlTimer); return; }
    S.copy.ttl--;
    var el=$('#ttl'); if(el) el.textContent=fmt(S.copy.ttl);
    if(S.copy.ttl<=0){ clearInterval(ttlTimer); S.copy.previewed=false; render(); }
  },1000);
}
function startHealth(){
  stopHealth();
  S.health.timer=setInterval(function(){
    S.health.secs++;
    var el=$('#secs'); if(el) el.textContent=S.health.secs+' с';
    if(S.health.secs>=4){ stopHealth(); S.health.loaded=true; render(); }
  },700);
}
function stopHealth(){ clearInterval(S.health.timer); S.health.timer=null; }

$('#burger').addEventListener('click',function(){
  var open=root.getAttribute('data-nav')==='open';
  root.setAttribute('data-nav',open?'collapsed':'open');
  this.setAttribute('aria-expanded',open?'false':'true');
});
$('#themeBtn').addEventListener('click',function(){
  var dark=root.getAttribute('data-theme')==='dark';
  root.setAttribute('data-theme',dark?'light':'dark');
  $('#themeIcon').innerHTML=dark
    ?'<circle cx="10" cy="10" r="3.6"/><path d="M10 1.6v2.2M10 16.2v2.2M18.4 10h-2.2M3.8 10H1.6M15.9 4.1l-1.6 1.6M5.7 14.3l-1.6 1.6M15.9 15.9l-1.6-1.6M5.7 5.7L4.1 4.1"/>'
    :'<path d="M16.5 11.6A7 7 0 0 1 8.4 3.5a7 7 0 1 0 8.1 8.1z"/>';
});
$('#langBtn').addEventListener('click',function(){
  this.textContent=this.textContent==='RU'?'EN':'RU';
});

render();
})();
</script>
</body>
</html>
