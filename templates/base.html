<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}GPManager{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EGP%3C/text%3E%3C/svg%3E">

    <!-- no-flash: apply stored theme before first paint -->
    <script>
    (function () {
        try {
            var t = localStorage.getItem('gp-theme');
            if (t) { document.documentElement.setAttribute('data-theme', t); }
        } catch (e) {}
    })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>

<nav class="gp-nav">
    <a class="gp-brand" href="/">
        <span class="gp-logo">GP</span> GPManager
    </a>

    <div class="gp-links">
        <a href="/" class="{% if request.path in ['/', '/dashboard'] %}active{% endif %}">Dashboard</a>
        <a href="/connections" class="{% if request.path.startswith('/connections') %}active{% endif %}">Connections</a>
        <a href="/objects" class="{% if request.path == '/objects' %}active{% endif %}">Objects</a>
        <a href="/maintenance" class="{% if request.path == '/maintenance' %}active{% endif %}">Maintenance</a>
        <a href="/vacuum" class="{% if request.path == '/vacuum' %}active{% endif %}">Vacuum / Analyze</a>
        <a href="{{ url_for('gpcopy_page') }}" class="{% if request.path.startswith('/gpcopy') %}active{% endif %}">gpcopy</a>
    </div>

    <div class="gp-spacer"></div>

    <button class="gp-theme" id="gpThemeBtn" type="button" aria-label="Toggle light / dark theme">🌙</button>
</nav>

<main class="container-fluid py-4">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/motion.js') }}"></script>

<script>
(function () {
    var btn = document.getElementById('gpThemeBtn');
    var root = document.documentElement;

    function current() {
        var t = root.getAttribute('data-theme');
        if (t) { return t; }
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function update() {
        if (btn) { btn.textContent = current() === 'dark' ? '☀️' : '🌙'; }
    }
    function apply(t) {
        root.setAttribute('data-theme', t);
        try { localStorage.setItem('gp-theme', t); } catch (e) {}
        update();
    }
    if (btn) {
        btn.addEventListener('click', function () {
            apply(current() === 'dark' ? 'light' : 'dark');
        });
    }
    update();
})();
</script>

{% block scripts %}{% endblock %}
</body>
</html>
