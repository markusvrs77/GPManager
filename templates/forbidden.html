<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Нет доступа — Opsentri</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <script>
    (function () {
        try {
            var t = localStorage.getItem('gp-theme');
            if (t) { document.documentElement.setAttribute('data-theme', t); }
        } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/auth.css?v=3">
</head>
<body class="auth-body">
<main class="auth-card">
    <h1 class="auth-title">Нет доступа</h1>
    <p class="auth-lead">{{ message }}</p>

    {% if sections %}
    <p class="auth-lead">Открытые вам разделы:</p>
    <nav class="auth-links">
        {% for href, label in sections %}
        <a href="{{ href }}">{{ label }}</a>
        {% endfor %}
    </nav>
    {% else %}
    <p class="auth-lead">
        Ни один раздел вам пока не выдан. Попросите администратора
        открыть нужные — до этого делать здесь нечего.
    </p>
    {% endif %}

    <form class="auth-alt" method="post" action="/logout">
        <button type="submit">Выйти{% if current_user %} из учётной записи
            «{{ current_user.username }}»{% endif %}</button>
    </form>
</main>
</body>
</html>
