{% extends "base.html" %}

{% block title %}Пользователи · Opsentri{% endblock %}

{% block content %}

<style>
/* ============ пользователи: список слева, разбор справа ============ */
.us { display: grid; grid-template-columns: 300px minmax(0, 1fr);
  gap: 16px; align-items: start; }

.us-panel { background: var(--surface); border: 1px solid var(--glass-border);
  border-radius: var(--radius); padding: 18px; }

.us-sec { font-size: 12px; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-muted); margin: 0 0 14px;
  display: flex; align-items: center; gap: 9px; }
.us-sec::before { content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent-grad); flex: none; }

/* --- список --- */
.us-list { display: flex; flex-direction: column; gap: 6px; }

.us-row { display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border: 1px solid transparent; border-radius: var(--radius-sm);
  background: transparent; text-align: left; cursor: pointer; color: inherit;
  transition: background var(--dur-fast), border-color var(--dur-fast); }
.us-row:hover { background: var(--row-hover); }
.us-row.active { background: color-mix(in srgb, var(--a1) 10%, transparent);
  border-color: color-mix(in srgb, var(--a1) 45%, transparent); }

.us-av { width: 30px; height: 30px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #fff; background: var(--accent-grad); }
.us-av.off { background: var(--idle); }

.us-nm { min-width: 0; }
.us-nm b { display: block; font-size: 13.5px; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.us-nm span { font-size: 11.5px; color: var(--text-muted); }

.us-tag { margin-left: auto; flex: none; font-size: 10.5px; font-weight: 800;
  letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px;
  border-radius: var(--radius-pill); border: 1px solid var(--hairline);
  color: var(--text-muted); background: var(--surface-2); }
.us-tag.off { color: var(--crit);
  border-color: color-mix(in srgb, var(--crit) 45%, transparent); }

.us-add { margin-top: 12px; width: 100%; }

/* --- разбор --- */
.us-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
  padding-bottom: 16px; border-bottom: 1px solid var(--hairline); }
.us-head .us-av { width: 42px; height: 42px; font-size: 15px; }
.us-head h2 { margin: 0; font-size: 18px; font-weight: 800; }
.us-head .sub { font-size: 12px; color: var(--text-muted); }
.us-head .sp { margin-left: auto; display: flex; gap: 8px; flex: none; }

.us-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px; margin-bottom: 20px; }

.us-note { font-size: 12.5px; color: var(--text-muted); line-height: 1.5;
  padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--hairline);
  margin-bottom: 16px; }

/* --- возможности --- */
.us-caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px 20px; margin-bottom: 20px; }
.us-cap-grp > h6 { font-size: 11px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px; }

.us-cap { display: flex; align-items: center; gap: 8px; padding: 4px 0;
  font-size: 13px; }
.us-cap input { flex: none; }
.us-cap .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.us-cap .ex { flex: none; margin-left: auto; font-size: 10px; font-weight: 800;
  letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px;
  border-radius: var(--radius-pill); cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent);
  color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.us-cap .ex[hidden] { display: none; }

/* --- кластеры --- */
.us-conns { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px 16px; }
.us-conn { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.us-conn .host { color: var(--text-muted); font-family: var(--font-mono);
  font-size: 11.5px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }

.us-foot { display: flex; gap: 8px; align-items: center;
  margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--hairline); }
.us-foot .sp { margin-left: auto; }

.us-empty { color: var(--text-muted); font-size: 13px; padding: 30px 0;
  text-align: center; }

/* --- пояснения внутри диалогов создания и сброса пароля --- */
.us-dlg-lead { margin: 0; font-size: 13px; color: var(--text-muted);
  line-height: 1.5; }
.us-dlg-gap { margin-top: 12px; }

@media (max-width: 900px) {
  .us { grid-template-columns: minmax(0, 1fr); }
  .us-grid { grid-template-columns: minmax(0, 1fr); }
}
</style>

<div class="us">

    <section class="us-panel">
        <h6 class="us-sec">Учётные записи</h6>
        <div class="us-list" id="usList"></div>
        <button class="btn btn-primary us-add" type="button" id="usAddBtn">
            Добавить пользователя
        </button>
    </section>

    <section class="us-panel" id="usDetail">
        <div class="us-empty">Выберите учётную запись слева</div>
    </section>

</div>

<script type="application/json" id="usData">
{{ {
    "users": users,
    "capabilities": capabilities,
    "roles": roles,
    "roleDefaults": role_defaults,
    "connections": connections,
    "meId": me.id if me else None,
    "minPasswordLength": min_password_length
} | tojson }}
</script>

<script src="{{ url_for('static', filename='js/users.js') }}?v=1"></script>

{% endblock %}
